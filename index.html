<!DOCTYPE html>
<html lang="en" translate="no">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <link rel="icon" type="image/png" href="icon/fullscreen.png">
    <link href="fonts/Midnight crimson.ttf" rel="stylesheet">
    <script src="models/drawable-object.class.js"></script>
    <script src="models/movable-object.class.js"></script>
    <script src="models/charakter.class.js"></script>
    <script src="models/chicken.class.js"></script>
    <script src="models/cloud.class.js"></script>
    <script src="models/background-object.class.js"></script>
    <script src="models/collectible-object.class.js"></script>
    <script src="models/endboss.class.js"></script>
    <script src="models/status-bar.class.js"></script>
    <script src="models/keyboard.class.js"></script>
    <script src="models/throwable-objects.class.js"></script>
    <script src="models/level.class.js"></script>
    <script src="levels/level1.js"></script>
    <script src="models/world.class.js"></script>
    <script src="js/game.js"></script>

    <title>El Pollo Loco</title>
</head>

<body onload="init()">
    <div class="orientation-hint">
        <div class="phone-icon"></div>
        <p>Drehe dein Handy ins Querformat</p>
    </div>

    <div id="fullscreen">
        <div id="startScreen" class="start-screen">
            <img src="img/9_intro_outro_screens/start/startscreen_1.png" alt="Startscreen 1">
            <button class="start-button" onclick="startGame()">START</button>
        </div>

        <div id="gameOverScreen" class="game-over-screen hidden">
            <img src="img/You won, you lost/Game Over.png" alt="Game Over">
            <button class="restart-button" onclick="restartGame()">Restart Game</button>
        </div>

        <div id="winScreen" class="game-over-screen hidden">
            <img src="img/You won, you lost/You Win A.png" alt="You Win">
            <button class="restart-button" onclick="restartGame()">Restart Game</button>
        </div>

        <div id="loadingScreen" class="loading-screen hidden" aria-live="polite">
            <div class="loading-puzzle" aria-hidden="true">
                <div class="loading-piece loading-piece-top-left"></div>
                <div class="loading-piece loading-piece-top-right"></div>
                <div class="loading-piece loading-piece-bottom-left"></div>
                <div class="loading-piece loading-piece-bottom-right"></div>
            </div>
            <img id="loadingPepe" class="loading-pepe" src="img/2_character_pepe/2_walk/W-21.png" alt="Pepe laeuft">
        </div>

        <canvas id="polloCanvas" class="hidden" width="720" height="480"></canvas>

        <div id="mobileControls" class="mobile-controls hidden">
            <div class="mobile-controls-left">
                <button id="mobileLeft" class="mobile-control-button" aria-label="Links">‹</button>
                <button id="mobileRight" class="mobile-control-button" aria-label="Rechts">›</button>
            </div>
            <div class="mobile-controls-right">
                <button id="mobileJump" class="mobile-control-button action-button" aria-label="Springen">^</button>
                <button id="mobileThrow" class="mobile-control-button action-button" aria-label="Flasche werfen"><img src="img/6_salsa_bottle/bottle_rotation/1_bottle_rotation.png" alt="Flasche werfen"></button>
            </div>
        </div>

    </div>
    <button id="fullscreenButton" class="fullscreen-button hidden" onclick="openFullscreen();"></button>
</body>

</html>
